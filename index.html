<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>별빛 퀴즈 리그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a night-sky observatory console. Single dark theme by design — the sky is the stage. */
:root{
  color-scheme: dark;
  --sky:#070b1f; --sky-2:#0e1536; --panel:#141c44; --panel-2:#1c2656;
  --line:#2c3874; --ink:#eef1ff; --muted:#a6b0dc;
  --gold:#ffd166; --cyan:#62d6ff; --rose:#ff6b8b; --mint:#4fe0a6;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0;letter-spacing:.5px;text-wrap:balance}
.brand h1 span{color:var(--gold)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.units{display:flex;gap:8px;flex-wrap:wrap}
.unit-btn{font-family:var(--display);font-size:18px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.unit-btn[aria-pressed="true"]{background:var(--gold);color:var(--sky);border-color:var(--gold)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{font-family:var(--body);font-weight:700;font-size:15px;padding:10px 14px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--cyan)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 6px;text-wrap:balance}
h3{font-size:17px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px;max-width:65ch}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card .tag{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--cyan);text-transform:uppercase}
.card ul{margin:6px 0 0;padding-left:18px}
.card li{margin:3px 0}
.key{color:var(--gold);font-weight:700}
.formula{font-family:var(--mono);background:var(--sky-2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;display:inline-block}
.colorbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.colorbar div{text-align:center;font-size:12px}
.colorbar i{display:block;height:28px;border-radius:50%;width:28px;margin:0 auto 4px}
.sim-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 14px;font-family:var(--body);font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--ink);background:var(--panel-2)}
.sim{display:grid;gap:14px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:760px){.sim{grid-template-columns:1fr}}
canvas.view{width:100%;height:auto;aspect-ratio:16/10;background:var(--sky-2);border-radius:var(--r);border:1px solid var(--line);display:block}
.ctrl label{display:block;font-weight:700;margin:10px 0 4px}
input[type=range]{width:100%;accent-color:var(--gold)}
.readout{font-family:var(--mono);font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted)}
.verdict{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel-2);font-weight:700}
select{font-family:var(--body);font-size:15px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
/* quiz */
.quiz-start{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.mode h3{font-family:var(--display);font-weight:400;font-size:22px}
.field{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.field input{flex:1 1 160px;min-width:0;font-family:var(--body);font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sky-2);color:var(--ink)}
.btn{font-family:var(--display);font-size:18px;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;background:var(--gold);color:var(--sky)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:12px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.hud b{color:var(--gold)}
.timer{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold),var(--rose));width:100%;transition:width .2s linear}
.question{font-size:clamp(20px,3.2vw,28px);font-weight:700;line-height:1.4;margin:0 0 16px;text-wrap:balance}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{text-align:left;font-family:var(--body);font-size:17px;font-weight:700;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-family:var(--mono);color:var(--cyan);flex:none}
.opt.right{background:#11402f;border-color:var(--mint)}
.opt.wrong{background:#4a1626;border-color:var(--rose)}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.explain b{color:var(--gold)}
.teams{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:14px}
.team-btn{font-family:var(--body);font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px;cursor:pointer}
.team-btn[aria-pressed="true"]{background:var(--mint);color:var(--sky);border-color:var(--mint)}
.result{text-align:center;padding:24px 16px}
.result .big{font-family:var(--display);font-size:64px;color:var(--gold);line-height:1}
/* board */
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th,.board td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.board th{font-size:13px;color:var(--muted);font-weight:700}
.board td.n{font-family:var(--mono);text-align:right}
.board tr.me td{background:var(--panel-2)}
.rank{font-family:var(--display);font-size:20px;color:var(--muted);width:40px}
.rank.r1{color:var(--gold)}.rank.r2{color:#d9e1ff}.rank.r3{color:#ffb27a}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.on i{background:var(--mint)}
.teamboard{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.tcard input{width:100%;text-align:center;font-family:var(--body);font-weight:700;font-size:16px;background:transparent;border:0;color:var(--ink);border-bottom:1px dashed var(--line);padding:4px}
.tcard .pts{font-family:var(--display);font-size:40px;color:var(--gold);line-height:1.2}
.tcard .row{display:flex;gap:6px;justify-content:center}
.tcard .row button{flex:1;font-family:var(--mono);font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:6px 0;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--sky);font-weight:700;padding:10px 16px;border-radius:999px;z-index:20}
.split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>별빛 <span>퀴즈 리그</span></h1>
      <p>중학교 3학년 과학 · Ⅶ. 별과 우주 · 정리하고, 실험하고, 겨뤄 보자</p>
    </div>
    <div class="units" role="group" aria-label="단원 선택">
      <button class="unit-btn" id="u-star" data-unit="star" aria-pressed="true">1. 별</button>
      <button class="unit-btn" id="u-galaxy" data-unit="galaxy" aria-pressed="false">2. 은하와 우주</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="활동">
    <button class="tab" role="tab" id="t-learn" data-tab="learn" aria-selected="true">개념 정리</button>
    <button class="tab" role="tab" id="t-sim" data-tab="sim" aria-selected="false">시뮬레이션</button>
    <button class="tab" role="tab" id="t-quiz" data-tab="quiz" aria-selected="false">퀴즈 게임</button>
    <button class="tab" role="tab" id="t-board" data-tab="board" aria-selected="false">점수판</button>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
/* ---------- tiny helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); };
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- background stars ---------- */
(function sky() {
  const c = $("#stars"), x = c.getContext("2d");
  let pts = [];
  const fit = () => {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    c.width = innerWidth * d; c.height = innerHeight * d;
    pts = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: Math.random() * c.height, r: Math.random() * 1.3 * d + .3, a: Math.random() * .6 + .2 }));
    x.clearRect(0, 0, c.width, c.height);
    for (const p of pts) { x.globalAlpha = p.a; x.fillStyle = "#fff"; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); }
  };
  fit(); addEventListener("resize", fit);
})();

/* ---------- star data (textbook values where given; others approximate) ---------- */
const STARS = [
  { n: "나오스", c: "청색", hex: "#5b8cff", t: 40000, m: 2.2, M: -5.9, ly: 1100 },
  { n: "리겔", c: "청백색", hex: "#a9c8ff", t: 12000, m: 0.1, M: -7.8, ly: 860 },
  { n: "시리우스", c: "백색", hex: "#f4f6ff", t: 9900, m: -1.5, M: 1.4, ly: 8.6 },
  { n: "북극성", c: "황백색", hex: "#fff1b8", t: 6000, m: 2.0, M: -3.6, ly: 430 },
  { n: "태양", c: "황색", hex: "#ffd84d", t: 5800, m: -26.8, M: 4.8, ly: 0.0000158 },
  { n: "아크투루스", c: "주황색", hex: "#ff9f43", t: 4300, m: 0.0, M: -0.3, ly: 37 },
  { n: "베텔게우스", c: "적색", hex: "#ff5a4e", t: 3500, m: 0.4, M: -5.6, ly: 550 },
];

/* ---------- learn content ---------- */
const LEARN = {
  star: {
    title: "1. 별", lead: "별까지의 거리는 시차와 밝기로, 표면 온도는 색으로 알아낸다.",
    cards: [
      { tag: "01 · 연주 시차", h: "가까운 별은 시차가 크다", li: [
        "<span class='key'>시차</span>: 두 지점에서 같은 물체를 볼 때 생기는 방향 차이. 물체가 멀수록 작아진다.",
        "<span class='key'>연주 시차</span>: 지구가 공전하므로 6개월 간격으로 별을 보면 위치가 달라진다. 이때 시차의 <b>1/2</b>.",
        "단위는 ″(초). 1° = 3600″",
        "연주 시차가 1″인 별까지의 거리 = <b>1pc(파섹)</b> ≈ 3.26광년",
        "연주 시차는 거리에 <b>반비례</b> → 비교적 가까운 별에만 쓸 수 있다."],
        f: "별까지의 거리(pc) = 1 ÷ 연주 시차(″)" },
      { tag: "02 · 밝기와 등급", h: "숫자가 작을수록 밝은 별", li: [
        "1등급 별은 6등급 별보다 약 <b>100배</b> 밝다. 1등급 차이 ≈ 2.5배",
        "별의 밝기는 거리의 제곱에 반비례 → 거리 2배면 밝기 1/4",
        "<span class='key'>겉보기 등급</span>: 눈에 보이는 밝기",
        "<span class='key'>절대 등급</span>: 별이 10pc 거리에 있다고 할 때의 밝기 → 실제 밝기 비교"],
        f: "겉보기 < 절대 → 10pc보다 가깝다\n겉보기 = 절대 → 10pc\n겉보기 > 절대 → 10pc보다 멀다" },
      { tag: "03 · 색과 표면 온도", h: "푸를수록 뜨겁다", li: [
        "별의 색이 다른 까닭: 표면 온도가 다르기 때문",
        "표면 온도가 높을수록 파란색, 낮을수록 붉은색을 띤다.",
        "예: 리겔(청백색)은 베텔게우스(적색)보다 표면 온도가 높다."],
        bar: true },
    ]
  },
  galaxy: {
    title: "2. 은하와 우주", lead: "우리은하는 수많은 별과 성단, 성운으로 이루어져 있고, 우주는 지금도 팽창하고 있다.",
    cards: [
      { tag: "01 · 우리은하", h: "막대 나선 모양의 별 무리", li: [
        "위에서 보면 <b>막대 나선</b> 모양, 옆에서 보면 가운데가 볼록한 <b>원반</b> 모양",
        "지름 약 <b>30000pc</b>, 약 2천억 개의 별",
        "태양계는 은하 중심에서 약 <b>8500pc</b> 떨어진 나선팔에 있다.",
        "<span class='key'>은하수</span>: 지구에서 본 우리은하의 일부. 은하 중심 방향인 <b>여름철</b>에 넓고 밝게 보인다."] },
      { tag: "02 · 성단", h: "별들이 모인 집단", li: [
        "<span class='key'>산개 성단</span>: 수십~수만 개의 별이 엉성하게 모여 있다. 예: 플레이아데스(좀생이 성단)",
        "<span class='key'>구상 성단</span>: 수만~수십만 개의 별이 빽빽한 공 모양으로 모여 있다. 예: M22"] },
      { tag: "03 · 성간 물질과 성운", h: "가스와 티끌이 만드는 구름", li: [
        "<span class='key'>성간 물질</span>: 별과 별 사이의 가스와 티끌",
        "<span class='key'>성운</span>: 성간 물질이 모여 구름처럼 보이는 천체",
        "방출 성운: 주변 별빛을 흡수해 가열되어 스스로 빛을 낸다. 예: 오리온 대성운",
        "반사 성운: 주변 별빛을 반사해 밝게 보인다. 예: 마귀할멈 성운",
        "암흑 성운: 뒤쪽 별빛을 가려 어둡게 보인다. 예: 말머리성운"] },
      { tag: "04 · 팽창하는 우주", h: "우주에는 중심이 없다", li: [
        "은하들은 서로 멀어지고 있다. <b>멀리 있는 은하일수록 더 빨리</b> 멀어진다.",
        "풍선 모형: 풍선 표면 = 우주, 붙임딱지 = 은하, 풍선이 커지는 것 = 우주 팽창",
        "어느 은하에서 보아도 다른 은하들이 멀어지므로 우주 팽창의 중심은 없다."] },
    ]
  }
};

/* ---------- quiz bank ---------- */
const QUIZ = {
  star: [
    ["관측자와 물체 사이의 거리가 멀수록 시차는 어떻게 될까?", ["커진다", "작아진다", "변하지 않는다", "0이 된다"], 1, "시차는 거리에 반비례해서, 멀수록 작아진다."],

    h("p", { class: "note" }, S.right === S.qs.length ? "완벽해요! 별빛 마스터!" : S.right >= S.qs.length * .6 ? "잘했어요! 틀린 문제는 개념 정리에서 다시 확인해요." : "개념 정리와 시뮬레이션을 한 번 더 보고 다시 도전해요!"),
    h("div", { class: "field", style: "justify-content:center" }, h("button", { class: "btn", onclick: () => startQuiz({ mode: "solo", name: S.name }) }, "다시 도전"), h("button", { class: "btn ghost", onclick: () => setTab("board") }, "점수판 보기"))));
  saveScore(S.name, S.unit, S.score);
}

/* ---------- scoreboard ---------- */
async function saveScore(name, unit, score) {
  // local (this device) best per name
  let row = localBoard.find(r => r.name === name);
  if (!row) { row = { name, star: 0, galaxy: 0 }; localBoard.push(row); }
  const best = score > (row[unit] || 0);
  if (best) row[unit] = score;
  row.at = Date.now(); store.set("sq_board", localBoard);
  if (online && writeOk && me) {
    try {
      const ref = db.doc("scores/" + me);
      const cur = (await ref.get()).data() || {};
      const body = { name, star: cur.star || 0, galaxy: cur.galaxy || 0, at: Date.now() };
      if (score > body[unit] || cur.name !== name) { body[unit] = Math.max(score, body[unit]); await ref.set(body); }
      toast(best ? "새 최고 기록! 점수판에 올렸어요" : "점수판에 기록했어요");
      return;
    } catch (e) { writeOk = false; }
  }
  toast(best ? "새 최고 기록! 이 기기 점수판에 저장했어요" : "이 기기 점수판에 저장했어요");
}
function teamBoard(big) {
  const wrap = h("div", { class: "teamboard" });
  const order = big ? teams.map((t, i) => [t, i]).sort((a, b) => b[0].p - a[0].p) : teams.map((t, i) => [t, i]);
  for (const [t, i] of order) {
    const inp = h("input", { id: "team-" + i, value: t.n, "aria-label": `${i + 1}번째 모둠 이름`, onchange: (e) => { t.n = e.target.value.trim() || `${i + 1}모둠`; saveTeams(); } });
    const pts = h("div", { class: "pts" }, String(t.p));
    const bump = (d) => { t.p = Math.max(0, t.p + d); pts.textContent = t.p; saveTeams(); };
    wrap.append(h("div", { class: "tcard" }, inp, pts, h("div", { class: "row" }, h("button", { onclick: () => bump(-100), "aria-label": "100점 빼기" }, "−100"), h("button", { onclick: () => bump(100), "aria-label": "100점 더하기" }, "+100"))));
  }
  return wrap;
}
function renderBoard() {
  main.append(h("h2", {}, "점수판"));
  const st = h("span", { class: "status" + (online ? " on" : "") }, h("i"), online ? (writeOk ? "온라인 점수판 연결됨 · 반 친구들과 함께 보여요" : "온라인 점수판 보기만 가능 · 내 점수는 이 기기에 저장") : "이 기기에 저장되는 점수판");
  main.append(h("p", { class: "lead" }, "단원별 최고 점수로 순위를 매겨요. "), st);
  const split = h("div", { class: "split", style: "margin-top:14px" });
  for (const unit of ["star", "galaxy"]) {
    const rows = (online && writeOk && onlineRows ? onlineRows : localBoard).filter(r => (r[unit] || 0) > 0).sort((a, b) => b[unit] - a[unit]).slice(0, 20);
    const myName = store.get("sq_name", "");
    const tb = h("tbody", {}, rows.length ? rows.map((r, i) => h("tr", { class: r.name === myName ? "me" : "" }, h("td", { class: `rank r${i + 1}` }, i + 1), h("td", {}, r.name), h("td", { class: "n" }, (r[unit] || 0).toLocaleString())))
      : h("tr", {}, h("td", { colspan: "3", class: "note" }, "아직 기록이 없어요. 퀴즈 게임 개인전으로 첫 기록을 남겨 보세요!")));
    split.append(h("section", { class: "card" }, h("h3", {}, unit === "star" ? "1. 별 랭킹" : "2. 은하와 우주 랭킹"),
      h("div", { class: "tablewrap" }, h("table", { class: "board" }, h("thead", {}, h("tr", {}, h("th", {}, "순위"), h("th", {}, "닉네임"), h("th", { style: "text-align:right" }, "최고 점수"))), tb))));
  }
  main.append(split);
  main.append(h("h2", { style: "margin-top:28px" }, "모둠 대결 점수"), h("p", { class: "lead" }, "모둠 이름을 눌러 바꿀 수 있어요. 대결 모드에서 준 점수가 여기에 쌓여요. 이 화면이 켜진 기기에만 저장돼요."), teamBoard(false));
  const reset = h("button", { class: "btn ghost", onclick: () => {
    if (reset.dataset.armed) { teams.forEach(t => t.p = 0); saveTeams(); render(); toast("모둠 점수를 0으로 바꿨어요"); }
    else { reset.dataset.armed = "1"; reset.textContent = "한 번 더 누르면 초기화"; setTimeout(() => { if (reset.isConnected) { delete reset.dataset.armed; reset.textContent = "모둠 점수 초기화"; } }, 3000); }
  } }, "모둠 점수 초기화");
  main.append(h("div", { class: "field" }, reset));
}

/* ---------- online board via db (optional) ---------- */
(async () => {
  try {
    if (!window.claude?.use) return;
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d) return;
    db = d; online = true;
    try { me = u ? await u.id() : null; } catch { me = null; }
    let canWrite = null; try { canWrite = u ? await u.can("data.write") : null; } catch {}
    if (!me || canWrite === false) writeOk = false;
    db.collection("scores").onSnapshot((snap) => {
      onlineRows = snap.docs.map(s => s.data()).filter(Boolean).map(r => ({ name: String(r.name || "").slice(0, 12), star: +r.star || 0, galaxy: +r.galaxy || 0 }));
      if (state.tab === "board") render();
    }, () => { online = false; if (state.tab === "board") render(); });
    if (state.tab === "board") render();
  } catch { online = false; }
})();

setUnit(state.unit);
})();
</script>
